name: Decode signature icons
on:
  push:
    paths:
      - '**/*.b64.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets to PNG
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in **/*.b64.txt; do
            out="${f%.b64.txt}.png"
            base64 -d "$f" > "$out"
            echo "Wrote $out ($(wc -c < "$out") bytes)"
            file "$out"
          done
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.png'
          if git diff --staged --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Decode base64 signature icons to PNG"
          git push
